name: Daily EGX update

on:
  schedule:
    # 14:00 UTC = 4:00 م (شتاء) / 5:00 م (صيف) بتوقيت القاهرة: بعد إغلاق البورصة بكتير.
    # الأحد (0) لـ الخميس (4). GitHub ممكن يتأخر 15-60 دقيقة، عادي.
    - cron: "0 14 * * 0-4"
  workflow_dispatch:        # زرار "Run workflow" للتشغيل اليدوي

permissions:
  contents: write           # عشان الـ workflow يعمل commit للداتا

concurrency:
  group: egx-daily
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-pipeline.txt

      - name: Install pipeline dependencies
        run: pip install -r requirements-pipeline.txt

      - name: Update data + predict
        run: python scripts/run_daily.py

      - name: Commit updated data
        run: |
          git config user.name "egx-bot"
          git config user.email "egx-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && echo "Nothing changed." || git commit -m "Daily update $(date -u +%F)"
          git push
